---
# 1. Установка Nginx
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: latest
    update_cache: true

# 2. Создание директорий для каждого сайта
- name: Create sites folders
  ansible.builtin.file:
    path: "/var/www/{{ item }}/"
    state: directory
    mode: '0755'
  loop: '{{ sites }}'

# 3. Копирование index.html из шаблона в каждую папку
- name: Copy index from template
  ansible.builtin.template:
    src: 'index.html.j2'
    dest: '/var/www/{{ item }}/index.html'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ sites }}'

# 4. Копирование конфигурации vhost из шаблона
- name: Copy nginx config from template
  ansible.builtin.template:
    src: 'site.conf.j2'
    dest: '/etc/nginx/conf.d/site-{{ item }}.conf'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ sites }}'
  notify: restart nginx---
# tasks file for roles/nginx-vhosts
